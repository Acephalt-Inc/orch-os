name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Repo variable CI_RUNS_ON (e.g. gcp-ci) moves this job to self-hosted runners;
    # unset -> GitHub-hosted ubuntu-latest (billed minutes).
    # Fork pull requests never reach the self-hosted runners.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNS_ON || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-to-end install check
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/e2e-install.ps1
  windows:
    # Windows minutes are billed: run only for release candidates (branch ci/release-*)
    # or when the repo variable CI_WINDOWS is 'true'.
    if: ${{ startsWith(github.ref, 'refs/heads/ci/release-') || vars.CI_WINDOWS == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lead pack tests on Windows (measurement, not required)
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          ORCH_LEAD_UNMEASURED: "1"
        run: node node_modules/vitest/vitest.mjs run tests/lead-cli.test.ts tests/lead-install.test.ts tests/lead-mutations.test.ts tests/lead-pack.test.ts tests/lead-process.test.ts
      - name: End-to-end install check (Windows PowerShell)
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/e2e-install.ps1
