name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-to-end install check
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/e2e-install.ps1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lead pack tests on Windows (measurement, not required)
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          ORCH_LEAD_UNMEASURED: "1"
        run: node node_modules/vitest/vitest.mjs run tests/lead-cli.test.ts tests/lead-install.test.ts tests/lead-mutations.test.ts tests/lead-pack.test.ts tests/lead-process.test.ts
      - name: End-to-end install check (Windows PowerShell)
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/e2e-install.ps1
