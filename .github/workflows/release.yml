name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm CLI 11.5.1+ (docs.npmjs.com/trusted-publishers).
      - name: Update npm
        run: npm i -g npm@^11.5.1

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # No NPM_TOKEN / NODE_AUTH_TOKEN: npm publish authenticates via OIDC
      # (npm Trusted Publishing) using the id-token: write permission above.
      # Provenance attestations are generated automatically.
      - name: Publish
        run: npm publish --access public
